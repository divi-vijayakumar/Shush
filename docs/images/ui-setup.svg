<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191d"/><stop offset="1" stop-color="#0d0e11"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d64f7"/><stop offset="1" stop-color="#3d36a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".46"/>
    </filter>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace}
      .muted{fill:#9297a1}.dim{fill:#666b75}.white{fill:#f5f5f7}.accent{fill:#9d98ff}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1320" cy="100" r="360" fill="#5149dd" opacity=".08"/>
  <circle cx="180" cy="920" r="310" fill="#746cf8" opacity=".05"/>

  <g filter="url(#shadow)">
    <rect x="100" y="70" width="1400" height="860" rx="28" fill="#202327" stroke="#3a3e45"/>
    <path d="M128 70h1344a28 28 0 0 1 28 28v50H100V98a28 28 0 0 1 28-28z" fill="#292c31"/>
    <circle cx="140" cy="109" r="8" fill="#ff605c"/><circle cx="168" cy="109" r="8" fill="#ffbd44"/><circle cx="196" cy="109" r="8" fill="#00ca4e"/>
    <text x="800" y="117" text-anchor="middle" class="ui muted" font-size="17" font-weight="600">Shush — Setup Guide</text>
  </g>

  <rect x="100" y="148" width="330" height="782" fill="#191c20"/>
  <g transform="translate(138 190)">
    <rect width="58" height="58" rx="15" fill="url(#brand)"/>
    <circle cx="29" cy="23" r="8" fill="#f2f0ff"/>
    <path d="M25 29h8v17l-4 5-4-5z" fill="#f2f0ff"/>
    <text x="78" y="25" class="ui white" font-size="24" font-weight="750">Shush</text>
    <text x="78" y="49" class="ui muted" font-size="15">Local encrypted vault</text>
  </g>

  <text x="138" y="310" class="ui dim" font-size="13" font-weight="700" letter-spacing="1.4">PROFILES</text>
  <g class="ui">
    <rect x="124" y="330" width="282" height="62" rx="12" fill="#302e55"/>
    <circle cx="157" cy="361" r="14" fill="#7169f4"/><text x="185" y="358" class="white" font-size="17" font-weight="650">Personal</text><text x="185" y="378" class="muted" font-size="13">personal@example.com</text>
    <circle cx="157" cy="424" r="14" fill="#40444c"/><text x="185" y="429" class="white" font-size="17" font-weight="600">Work</text>
    <circle cx="157" cy="487" r="14" fill="#40444c"/><text x="185" y="492" class="white" font-size="17" font-weight="600">Project Lab</text>
  </g>
  <line x1="132" y1="548" x2="398" y2="548" stroke="#353941"/>
  <g class="ui muted" font-size="16">
    <text x="148" y="590">◆  All items</text><text x="148" y="638">⌘  Quick secrets</text><text x="148" y="686">{ }  JSON &amp; config</text><text x="148" y="734">▣  Retired</text>
  </g>
  <circle cx="148" cy="876" r="6" fill="#50d890"/><text x="166" y="882" class="ui muted" font-size="14">Agent Vault running locally</text>

  <g class="ui">
    <text x="490" y="220" class="white" font-size="38" font-weight="780">Set up Shush on your Mac</text>
    <text x="490" y="258" class="muted" font-size="18">Four steps. No Shush cloud account or subscription.</text>
    <rect x="1220" y="200" width="218" height="38" rx="19" fill="#292b4b" stroke="#504aad"/>
    <text x="1329" y="225" text-anchor="middle" class="accent" font-size="13" font-weight="700" letter-spacing="1">0.2.0 • LOCAL ONLY</text>

    <g transform="translate(490 310)">
      <rect width="445" height="220" rx="20" fill="#282b30" stroke="#3a3e46"/>
      <circle cx="52" cy="52" r="24" fill="#5f57dd"/><text x="52" y="60" text-anchor="middle" class="white" font-size="21" font-weight="750">1</text>
      <text x="92" y="49" class="white" font-size="22" font-weight="700">Install the app</text>
      <text x="36" y="97" class="muted" font-size="16">Open the DMG and drag Shush into</text><text x="36" y="122" class="muted" font-size="16">Applications. Choose Replace when updating.</text>
      <rect x="36" y="153" width="373" height="42" rx="10" fill="#1d1f23"/>
      <text x="54" y="179" class="mono accent" font-size="14">Shush-0.2.0-arm64.dmg</text>
    </g>

    <g transform="translate(965 310)">
      <rect width="445" height="220" rx="20" fill="#282b30" stroke="#3a3e46"/>
      <circle cx="52" cy="52" r="24" fill="#5f57dd"/><text x="52" y="60" text-anchor="middle" class="white" font-size="21" font-weight="750">2</text>
      <text x="92" y="49" class="white" font-size="22" font-weight="700">Create your local vault</text>
      <text x="36" y="97" class="muted" font-size="16">Choose an account email and a strong vault</text><text x="36" y="122" class="muted" font-size="16">passphrase. Shush never saves the passphrase.</text>
      <rect x="36" y="153" width="373" height="42" rx="10" fill="#1d1f23"/>
      <text x="54" y="179" class="mono muted" font-size="14">Data: ~/.agent-vault</text>
    </g>

    <g transform="translate(490 558)">
      <rect width="445" height="220" rx="20" fill="#282b30" stroke="#3a3e46"/>
      <circle cx="52" cy="52" r="24" fill="#5f57dd"/><text x="52" y="60" text-anchor="middle" class="white" font-size="21" font-weight="750">3</text>
      <text x="92" y="49" class="white" font-size="22" font-weight="700">Install the CLI</text>
      <text x="36" y="97" class="muted" font-size="16">Open CLI Access in the toolbar, then select</text><text x="36" y="122" class="muted" font-size="16">Install CLI. It uses your macOS Keychain.</text>
      <rect x="36" y="153" width="373" height="42" rx="10" fill="#5a52d5"/>
      <text x="222" y="180" text-anchor="middle" class="white" font-size="15" font-weight="700">CLI Access  →  Install CLI</text>
    </g>

    <g transform="translate(965 558)">
      <rect width="445" height="220" rx="20" fill="#282b30" stroke="#3a3e46"/>
      <circle cx="52" cy="52" r="24" fill="#5f57dd"/><text x="52" y="60" text-anchor="middle" class="white" font-size="21" font-weight="750">4</text>
      <text x="92" y="49" class="white" font-size="22" font-weight="700">Separate personal &amp; work</text>
      <text x="36" y="97" class="muted" font-size="16">Use Manage Profiles to create isolated vaults.</text><text x="36" y="122" class="muted" font-size="16">Shush supports up to 10 profiles.</text>
      <rect x="36" y="153" width="373" height="42" rx="10" fill="#1d1f23"/>
      <text x="54" y="179" class="mono accent" font-size="14">Personal  •  Work  •  Project Lab</text>
    </g>
  </g>

  <text x="800" y="872" text-anchor="middle" class="ui muted" font-size="15">Setup illustration — contains demo data only</text>
</svg>
